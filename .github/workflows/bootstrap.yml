name: Bootstrap landing v1

on:
  push:
    branches: [feat/landing-v1]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified source snapshot
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .bootstrap/snapshot.b64 > /tmp/landing.tar.gz
          tar -xzf /tmp/landing.tar.gz
          mkdir -p public/brand public/cases public/images
          cp tmp/blob-a5ad.bin public/brand/logo.png
          cp tmp/blob-509.bin public/cases/students-registration.webp
          cp tmp/blob-03a.bin public/images/julio-dassaevy.webp
          sed -i 's#@/content/cases#../content/cases#' tests/core.test.ts
          sed -i 's#@/lib/site#../lib/site#' tests/core.test.ts
          rm -rf .bootstrap tmp
          rm -f tmp-marker.txt sync-test.txt public/brand/logo.png.base64-placeholder
          rm -f .github/workflows/bootstrap.yml

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm run test:run

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit verified landing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build Dassaevy Labs landing v1"
          git push origin HEAD:feat/landing-v1
