name: Bootstrap project sync

on:
  push:
    branches:
      - feat/landing-v1

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct verified project snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/project.tgz
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bootstrap -exec rm -rf {} +
          tar -xzf /tmp/project.tgz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-sync.yml

      - name: Commit reconstructed project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build Dassaevy Labs landing page" || exit 0
          git push origin HEAD:feat/landing-v1
